<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Positioning</title>

    <style>
        .container {
            position: relative;
            width: 400px;
            height: 250px;
            background-color: lightblue;
        }

        .box {
            position: absolute;
            top: 30px;
            right: 30px;
            background-color: pink;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Positioning</h1>

    <div class="container">
        <div class="box">
            Positioned Box
        </div>
    </div>

</body>
</html>
