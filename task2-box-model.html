<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Box Model</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .box {
            width: 300px;
            padding: 30px;
            border: 5px solid black;
            margin: 30px;
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        This is a box model example.
    </div>

</body>
</html>
