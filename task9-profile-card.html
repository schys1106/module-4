<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Profile Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            position: relative;
            width: 300px;
            background-color: white;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 10px;
            text-align: center;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: lightgreen;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

        .card h2 {
            margin: 15px 0 5px;
        }

        .card p {
            color: gray;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .card {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>My Profile Card</h1>

    <div class="container">

        <div class="card">

            <span class="badge">ONLINE</span>

            <img src="https://via.placeholder.com/100" alt="Profile">

            <h2>Sumaiya Chowdhury</h2>

            <p>CSE Student</p>

            <p>Learning Web Development</p>

        </div>

    </div>

</body>

</html>
